services:
  api:
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://127.0.0.1:8080
      GAME_ORIGIN: http://127.0.0.2:8081
      GAME_HOST: 0.0.0.0
      GAME_PORT: 3003
      BUILDS_PATH: /app/data/builds
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - playground-data:/app/data
    ports:
      - "127.0.0.2:8081:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    build:
      context: .
      dockerfile: infra/docker/Web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  playground-data:
